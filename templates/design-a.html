<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<style>
  /* Diseño A — ATS-First: una columna, sin color, sin decoración.
     Máxima compatibilidad de parseo. Para portales de empleo. */
  @page { size: A4; margin: 18mm 20mm; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 11pt;
    line-height: 1.4;
    color: #000000;
    margin: 0;
  }
  h1 { font-size: 16pt; margin: 0 0 4pt 0; font-weight: bold; }
  h2 {
    font-size: 11.5pt;
    text-transform: uppercase;
    border-bottom: 1px solid #000000;
    margin: 14pt 0 6pt 0;
    padding-bottom: 2pt;
    font-weight: bold;
  }
  h3 { font-size: 11pt; margin: 8pt 0 2pt 0; font-weight: bold; }
  p { margin: 0 0 6pt 0; }
  ul { margin: 0 0 8pt 0; padding-left: 16pt; }
  li { margin-bottom: 2pt; }
  .contact { margin-bottom: 10pt; }
  a { color: #000000; text-decoration: none; }
  /* Sin columnas, sin tablas, sin imágenes: a propósito. */
</style>
</head>
<body>
{{content}}
</body>
</html>
