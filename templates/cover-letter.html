<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<style>
  @page { size: A4; margin: 25mm 25mm; }
  body {
    font-family: 'Lato', 'Inter', Arial, sans-serif;
    font-size: 11pt;
    line-height: 1.6;
    color: #222222;
  }
  .header { margin-bottom: 18pt; }
  .header .name { font-size: 14pt; font-weight: 700; }
  .header .contact { font-size: 9.5pt; color: #555555; }
  .date { margin-bottom: 14pt; }
  p { margin: 0 0 12pt 0; }
</style>
</head>
<body>
<div class="header">
  <div class="name">{{candidate_name}}</div>
  <div class="contact">{{candidate_contact}}</div>
</div>
<div class="date">{{date}}</div>
{{content}}
</body>
</html>
