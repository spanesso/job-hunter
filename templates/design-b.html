<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<style>
  /* Diseño B — Balanced: una columna, tipografía y acentos mínimos.
     ~95%+ compatibilidad ATS. Para envío directo a reclutadores. */
  @page { size: A4; margin: 18mm 20mm; }
  :root { --accent: #1f4e5f; }
  body {
    font-family: 'Lato', 'Inter', Arial, sans-serif;
    font-size: 10.5pt;
    line-height: 1.45;
    color: #222222;
    margin: 0;
  }
  h1 {
    font-size: 19pt;
    margin: 0 0 2pt 0;
    font-weight: 700;
    color: var(--accent);
  }
  h1 + p.contact { border-bottom: 2px solid var(--accent); padding-bottom: 8pt; }
  h2 {
    font-size: 11.5pt;
    text-transform: uppercase;
    letter-spacing: 0.5pt;
    color: var(--accent);
    margin: 16pt 0 6pt 0;
    font-weight: 700;
  }
  h3 { font-size: 11pt; margin: 9pt 0 2pt 0; font-weight: 700; color: #333333; }
  p { margin: 0 0 6pt 0; }
  ul { margin: 0 0 8pt 0; padding-left: 16pt; }
  li { margin-bottom: 2pt; }
  a { color: var(--accent); text-decoration: none; }
  /* Sin columnas laterales, sin íconos, sin tablas: solo tipografía y color. */
</style>
</head>
<body>
{{content}}
</body>
</html>
